name: Moji

options:
  bundleIdPrefix: com.raydon
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.3.1"
    CURRENT_PROJECT_VERSION: "37"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SUPPORTS_MACCATALYST: NO

targets:
  Moji:
    type: application
    platform: iOS
    sources:
      - path: Moji
        excludes:
          - Info.plist
          - Moji.entitlements
      - path: Shared
    settings:
      base:
        # Upgrade identity: keep stable so Moji installs over the existing app.
        PRODUCT_BUNDLE_IDENTIFIER: com.raydon.minuteplan
        PRODUCT_NAME: Moji
        INFOPLIST_FILE: Moji/Info.plist
        CODE_SIGN_ENTITLEMENTS: Moji/Moji.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: MojiWidget
        embed: true

  MojiWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MojiWidget
        excludes:
          - Info.plist
          - MojiWidget.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raydon.minuteplan.widget
        PRODUCT_NAME: MojiWidget
        INFOPLIST_FILE: MojiWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: MojiWidget/MojiWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  MojiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MojiTests
    dependencies:
      - target: Moji
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raydon.moji.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Moji:
    build:
      targets:
        Moji: all
        MojiWidget: all
        MojiTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MojiTests
    archive:
      config: Release
